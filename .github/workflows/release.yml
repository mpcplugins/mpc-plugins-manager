# Publishes a GitHub Release when a version tag (v1.0.0, v1.0.1, ...) is pushed.
# The release zip and its notes are prepared on The Disk King's computer and committed under release/<version>/.
# Uses only GitHub's built-in per-run pass (GITHUB_TOKEN) and the gh tool that GitHub's runners already have.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          DIR="release/$V"
          test -f "$DIR/NOTES.md" || { echo "missing $DIR/NOTES.md"; exit 1; }
          ls "$DIR"/*.zip > /dev/null || { echo "missing zip in $DIR"; exit 1; }
          ( cd "$DIR" && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )
          gh release create "$GITHUB_REF_NAME" "$DIR"/*.zip "$DIR/SHA256SUMS.txt" \
            --title "MPC Plugins Manager $V" --notes-file "$DIR/NOTES.md"
